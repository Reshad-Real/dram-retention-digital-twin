# =====================================================================
#  Literature base for the dramdt study.
#
#  Two groups:
#    `recent`     2021-2026 works that position this study (located by
#                 literature search; the URL recorded is the one that was
#                 retrieved, so every entry is checkable).
#    `foundational`  the canonical methodological references that the
#                 framework's algorithms and statistics are built on.
#
#  Entries carry only bibliographic fields that were actually confirmed.
#  Where a field could not be verified it is omitted rather than guessed.
# =====================================================================

recent:
  - key: multifidelity_analog_2025
    title: >-
      Multi-Fidelity Surrogate Models for Accelerated Multi-Objective Analog
      Circuit Design and Optimization
    venue: Electronics (MDPI)
    year: 2025
    url: https://doi.org/10.3390/electronics15010105
    topic: surrogate modelling; multi-objective circuit optimisation
    relevance: >-
      Closest methodological neighbour: couples surrogate models with
      multi-objective search and high-fidelity verification for analog
      circuits.  This study differs in target (DRAM bit cell, including
      retention physics), in the breadth of the surrogate comparison, and in
      applying worst-case PVT reduction inside the optimisation loop.

  - key: analog_ml_review_2025
    title: "Analog Design and Machine Learning: A Review"
    venue: Electronics (MDPI)
    year: 2025
    url: https://doi.org/10.3390/electronics14173541
    topic: review of ML in analog design
    relevance: >-
      Survey establishing that surrogate-based and simulation-in-the-loop
      methods are the two dominant families; motivates the surrogate-first
      design adopted here.

  - key: analog_sizing_ea_dl_2024
    title: Analog circuit sizing based on Evolutionary Algorithms and deep learning
    venue: Expert Systems with Applications (Elsevier)
    year: 2024
    url: https://www.sciencedirect.com/science/article/abs/pii/S0957417423019826
    topic: evolutionary sizing with learned models
    relevance: >-
      Demonstrates large reductions in SPICE calls when evolutionary search is
      guided by learned models -- the same economics that make a 50k-sample
      training campaign worthwhile here.

  - key: ml_global_opt_2024
    title: Machine Learning Driven Global Optimisation Framework for Analog Circuit Design
    venue: arXiv
    year: 2024
    url: https://arxiv.org/abs/2404.02911
    topic: ML-guided global optimisation
    relevance: >-
      Reports SPICE-call reductions of 56-83 % against standard approaches;
      supports the surrogate-in-the-loop economics used in this framework.

  - key: ea_analog_benchmark_2023
    title: >-
      Performance Evaluation of Evolutionary Algorithms for Analog Integrated
      Circuit Design Optimisation
    venue: arXiv
    year: 2023
    url: https://arxiv.org/abs/2310.12440
    topic: benchmarking evolutionary optimisers on circuit problems
    relevance: >-
      Precedent for comparing several evolutionary optimisers on the same
      circuit problem under an equal budget, which is the protocol used here.

  - key: ai_native_eda_2024
    title: "The Dawn of AI-Native EDA: Opportunities and Challenges of Large Circuit Models"
    venue: arXiv
    year: 2024
    url: https://arxiv.org/abs/2403.07257
    topic: AI-native EDA landscape
    relevance: >-
      Positions learned circuit models within the wider EDA agenda and
      identifies dataset scarcity as a central obstacle -- which this study
      addresses by publishing its 50k-point dataset.

  - key: device_modeling_ml_2024
    title: "When Device Modeling Meets Machine Learning: Opportunities and Challenges"
    venue: ACM/IEEE International Symposium on Machine Learning for CAD (MLCAD)
    year: 2024
    url: https://dl.acm.org/doi/10.1145/3670474.3685972
    topic: ML for compact/device modelling
    relevance: >-
      Frames the device-model-to-ML interface this work sits on: BSIM4 physics
      supplies the ground truth, ML supplies the fast evaluator.

  - key: digital_twin_semiconductor_2022
    title: "Digital Twin for Secure Semiconductor Lifecycle Management: Prospects and Applications"
    venue: arXiv
    year: 2022
    url: https://arxiv.org/abs/2205.10962
    topic: digital twins in the semiconductor lifecycle
    relevance: >-
      Establishes digital-twin terminology for semiconductor artefacts; this
      study instantiates a *design-stage* twin of a DRAM bit cell.

  - key: spicepilot_2024
    title: "SPICEPilot: Navigating SPICE Code Generation and Simulation with AI Guidance"
    venue: arXiv
    year: 2024
    url: https://arxiv.org/abs/2410.20553
    topic: automated SPICE deck generation, PySpice-based datasets
    relevance: >-
      Uses PySpice to build SPICE datasets programmatically -- the same
      automation premise, applied there to code generation and here to
      physics-grounded design-space characterisation.

  - key: pyspice_netlist_framework_2023
    title: Python Framework for Modular and Parametric SPICE Netlists Generation
    venue: arXiv
    year: 2023
    url: https://arxiv.org/abs/2306.12224
    topic: parametric netlist generation
    relevance: >-
      Direct precedent for configuration-driven netlist construction; this
      framework extends the idea to a full measurement-and-modelling pipeline.

  - key: pyspice_memristor_snn_2024
    title: >-
      PySpice-Simulated In Situ Learning with Memristor Emulation for
      Single-Layer Spiking Neural Networks
    venue: Electronics (MDPI) 13(23), 4665
    year: 2024
    url: https://www.mdpi.com/2079-9292/13/23/4665
    topic: PySpice/NGSpice in a research pipeline
    relevance: >-
      Recent example of PySpice + NGSpice used as the simulation engine of a
      published study, supporting the toolchain choice.

  - key: easydram_2025
    title: >-
      EasyDRAM: An FPGA-based Infrastructure for Fast and Accurate End-to-End
      Evaluation of Emerging DRAM Techniques
    venue: arXiv
    year: 2025
    url: https://arxiv.org/abs/2506.10441
    topic: DRAM characterisation infrastructure
    relevance: >-
      Complementary measurement-side infrastructure: EasyDRAM characterises
      real devices, whereas this framework characterises the design space of a
      cell before silicon exists.

  - key: ramulator2_accuracy_2026
    title: "Re-Evaluating the Real-System Modeling Accuracy of Ramulator 2.0"
    venue: arXiv
    year: 2026
    url: https://arxiv.org/abs/2606.14566
    topic: DRAM simulator fidelity
    relevance: >-
      Argues that DRAM modelling accuracy must be validated rather than
      assumed -- the same principle applied here to the retention model, which
      is cross-checked against direct transient simulation.

  - key: pendram_2024
    title: >-
      PENDRAM: Enabling High-Performance and Energy-Efficient Processing of
      Deep Neural Networks through a Generalized DRAM Data Mapping Policy
    venue: arXiv
    year: 2024
    url: https://arxiv.org/abs/2408.02412
    topic: DRAM energy optimisation at the architecture level
    relevance: >-
      Represents the architecture-level branch of DRAM energy optimisation;
      this study operates one level below, at the bit cell and its periphery.

