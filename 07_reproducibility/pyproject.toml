[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dramdt"
version = "1.0.0"
description = "A Digital Twin-Driven Framework for Low-Power DRAM Optimization Using PySpice and Machine Learning"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "dramdt framework" }]
keywords = ["DRAM", "digital twin", "SPICE", "PySpice", "surrogate model",
            "multi-objective optimization", "explainable AI", "low power"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Electronic Design Automation",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
]

dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "lightgbm>=4.1",
  "catboost>=1.2",
  "optuna>=3.5",
  "shap>=0.44",
  "pymoo>=0.6.1",
  "PySpice>=1.5",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "XlsxWriter>=3.1",
  "joblib>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.29"]

[project.scripts]
dramdt = "dramdt.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: marks tests that invoke NGSpice repeatedly",
  "spice: marks tests that require a working NGSpice installation",
]

[tool.ruff]
line-length = 100
target-version = "py312"
